<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Live Data - 2h Running of Indy 250</title>

<style>
:root {
  --bg: #0c0c0c;
  --row: #141414;
  --row-hover: #1d1d1d;
  --header: #101010;
  --border: #2a2a2a;
  --red: #c40000;
  --text: #e6e6e6;
  --muted: #a0a0a0;
  --highlight: #ffd700;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Arial Narrow", Arial, Helvetica, sans-serif;
}

header {
  background: var(--header);
  border-bottom: 3px solid var(--red);
  padding: 14px 20px;
}

header h1 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 1px;
}

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1100px;
}

thead th {
  background: var(--header);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  padding: 10px 6px;
  border-bottom: 1px solid var(--border);
}

tbody tr {
  background: var(--row);
  transition: background 0.15s;
}

tbody tr:hover { background: var(--row-hover); }

td {
  padding: 10px 6px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  white-space: nowrap;
}

td.left { text-align: left; }
td.pos { font-weight: bold; }
td.avg { font-weight: bold; color: var(--highlight); }
.car { color: var(--muted); }
</style>
</head>

<body>

<header>
  <h1>Live Data - 2h Running of Indy 250</h1>
</header>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>P</th>
      <th>N</th>
      <th>NOME</th>
      <th>EQUIPE</th>
      <th>VOLTA 1</th>
      <th>VOLTA 2</th>
      <th>VOLTA 3</th>
      <th>VOLTA 4</th>
      <th>MÉDIA FINAL</th>
    </tr>
  </thead>
  <tbody id="grid"></tbody>
</table>
</div>

<script>
const dados = [
  { car: 1, pilot: "Ranniel Pereira", team: "RP Motorsports Honda", laps: ["0:39,003","0:38,966","0:38,973","0:38,901"] },
  { car: 44, pilot: "Celso Silva", team: "RP Motorsports Honda", laps: ["0:39,264","0:39,053","0:39,075","0:39,109"] },
  { car: 28, pilot: "Otavio Marinho", team: "RP Motorsports Honda", laps: ["0:38,847","0:38,853","0:38,883","0:38,870"] },
  { car: 69, pilot: "Luiz Henrique", team: "Sempher FlyTeam Project", laps: ["0:39,052","0:38,988","0:39,162","0:39,030"] },
  { car: 10, pilot: "Luiz Milton", team: "Sempher FlyTeam Project", laps: ["0:39,009","0:39,541","0:39,169","0:50,000"] },
  { car: 45, pilot: "Isac Nilton", team: "Mendonca Racing Team", laps: ["0:38,961","0:38,900","0:38,925","0:38,895"] },
  { car: 37, pilot: "Vitor Borges", team: "Mendonca Racing Team", laps: ["0:39,037","0:39,003","0:38,934","0:38,940"] },
  { car: 06, pilot: "Theo Torres", team: "Mendonca Racing Team", laps: ["0:38,894","0:38,896","0:38,946","0:39,005"] },
  { car: 40, pilot: "Lucas Taraciuk", team: "Need For Speed Racing", laps: ["0:38,971","0:38,938","0:38,937","0:38,962"] },
  { car: 33, pilot: "Nicolas Morais", team: "Need For Speed Racing", laps: ["0:39,048","0:38,900","0:38,943","0:38,889"] },
  { car: 25, pilot: "Skyline", team: "Need For Speed Racing", laps: ["0:39,085","0:39,099","0:39,109","0:39,062"] },
  { car: 07, pilot: "Tiago Souza", team: "Dallara Program Racing Team", laps: ["0:38,893","0:39,030","0:38,923","0:38,915"] },
  { car: 20, pilot: "Antonio de Lara", team: "SGTV Motorsport Team", laps: ["0:39,578","0:39,186","0:39,152","0:39,129"] },
  { car: 29, pilot: "Vicente", team: "SGTV Motorsport Team", laps: ["0:41,107","0:40,742","0:40,732","0:41,374"] },
  { car: 34, pilot: "Dirkson", team: "Lauda Motorsports", laps: ["0:39,182","0:39,348","0:39,347","0:39,375"] },
  { car: 16, pilot: "Vitor França", team: "Arrows Eagle Union", laps: ["0:39,144","0:39,068","0:40,168","0:39,032"] }
];

function toSeconds(t) {
  if (!t) return null;
  const [m, s] = t.split(":");
  return (+m * 60) + parseFloat(s.replace(",", "."));
}

function fromSeconds(sec) {
  const m = Math.floor(sec / 60);
  const r = (sec % 60).toFixed(3);
  return String(m).padStart(2, "0") + ":" + r.padStart(6, "0");
}

// calcular médias
dados.forEach(d => {
  const tempos = d.laps.map(toSeconds).filter(t => t !== null);
  if (tempos.length === 4) {
    d.avgSeconds = tempos.reduce((a,b)=>a+b,0) / 4;
    d.avgFormatted = fromSeconds(d.avgSeconds);
  } else {
    d.avgSeconds = null;
    d.avgFormatted = "--";
  }
});

// ordenar por média
dados.sort((a,b)=>{
  if (a.avgSeconds === null) return 1;
  if (b.avgSeconds === null) return -1;
  return a.avgSeconds - b.avgSeconds;
});

// renderizar
const tbody = document.getElementById("grid");
tbody.innerHTML = "";

dados.forEach((d,i)=>{
  tbody.innerHTML += `
    <tr>
      <td class="pos">${i+1}</td>
      <td class="car">${d.car}</td>
      <td class="left">${d.pilot}</td>
      <td class="left">${d.team}</td>
      ${d.laps.map(l=>`<td>${l || "--"}</td>`).join("")}
      <td class="avg">${d.avgFormatted}</td>
    </tr>
  `;
});
</script>

</body>
</html>
